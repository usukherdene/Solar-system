<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="center-image" style="--image-url: url(./galaxy.webp)">
    <div class="solar-system">
        <div class="sun center-image center-position" style="--image-url: url(./sun.png)"></div>

        <div class="orbit center-position" style="--orbit: 150px; --orbit-period: 8.8s;">
            <div class="planet center-position center-image" style="--image-url: url(./mercury.png); --planet: 15px; --rotation-speed: 5.86s;"></div>
        </div>

        <div class="orbit center-position" style="--orbit: 200px; --orbit-period: 22.5s;">
            <div class="planet center-position center-image" style="--image-url: url(./venus.png); --planet: 20px; --rotation-speed: 24.3s;"></div>
        </div>

        <div class="orbit center-position" style="--orbit: 300px; --orbit-period: 36.5s;">
            <div class="planet center-position center-image" style="--image-url: url(./earth.png); --planet: 23px; --rotation-speed: 1s;"></div>
        </div>

        <div class="orbit center-position" style="--orbit: 400px; --orbit-period: 22.5s;">
            <div class="planet center-position center-image" style="--image-url: url(./mars.png); --planet: 17px; --rotation-speed: 1.025s;"></div>
        </div>

        <div class="orbit center-position" style="--orbit: 550px; --orbit-period: 118.6s;">
            <div class="planet center-position center-image" style="--image-url: url(./jupiter.png); --planet: 45px; --rotation-speed: 0.41s;"></div>
        </div>
        <div class="orbit center-position" style="--orbit: 650px; --orbit-period: 294.6s;">
            <div class="planet center-position center-image" style="--image-url: url(./saturn.png); --planet: 40px; --rotation-speed: 0.445s;"></div>
        </div>

        <div class="orbit center-position" style="--orbit: 750px; --orbit-period: 840s;">
            <div class="planet center-position center-image" style="--image-url: url(./uranus.png); --planet: 35px; --rotation-speed: 0.717s;"></div>
        </div>

        <div class="orbit center-position" style="--orbit: 850px; --orbit-period: 1648s;">
            <div class="planet center-position center-image" style="--image-url: url(./mercury.png); --planet: 33px; --rotation-speed: 0.671s;"></div>
        </div>
    </div>
</body>
</html>
